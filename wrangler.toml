name = "tempmail-cfw"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Bindings — replace IDs before deploy
[[d1_databases]]
binding = "DB"
database_name = "tempmail-cfw"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "tempmail-cfw-attachments"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[vars]
# Comma-separated receiving domains; first is default
EMAIL_DOMAINS = "example.com"
INBOX_TTL_SECONDS = "3600"
SESSION_TTL_SECONDS = "43200"
MAX_MESSAGES_PER_INBOX = "50"
MAX_MESSAGE_SIZE_BYTES = "1048576"
MAX_ATTACHMENT_SIZE_BYTES = "10485760"
MAX_NAME_LENGTH = "32"

# Secrets (set via `wrangler secret put`):
# PANEL_PASSWORD
# SESSION_SECRET (optional)

[triggers]
crons = ["*/15 * * * *"]


# After `npm run web:build`, uncomment to serve the SPA from the Worker:
# [assets]
# directory = "./web/dist"
# binding = "ASSETS"
# not_found_handling = "single-page-application"
